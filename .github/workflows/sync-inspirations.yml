name: 同步灵感打卡

on:
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled]
  push:
    branches: [main]
    paths:
      - 'data/inspirations.json'
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

concurrency:
  group: sync-inspirations
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      issues: read
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 检查灵感数据是否为空
        id: check
        run: |
          CONTENT=$(cat data/inspirations.json 2>/dev/null | tr -d '[:space:]')
          if [ ! -f data/inspirations.json ] || [ "$CONTENT" = "[]" ] || [ -z "$CONTENT" ]; then
            echo "need_sync=true" >> $GITHUB_OUTPUT
            echo "灵感数据为空，开始从 Issues 恢复..."
          else
            echo "need_sync=false" >> $GITHUB_OUTPUT
            echo "灵感数据已存在，跳过恢复"
          fi

      - name: 获取灵感 Issues 并生成 JSON
        if: steps.check.outputs.need_sync == 'true' || github.event_name == 'issues' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p data
          gh issue list \
            --label "inspiration" \
            --state all \
            --json number,title,body,labels,createdAt,state \
            --limit 500 \
            | jq '[.[] | {
                number: .number,
                title: .title,
                content: .body,
                tags: [.labels[].name | select(. != "inspiration")],
                date: .createdAt,
                state: .state
              }]' \
            > data/inspirations.json

      - name: 提交更新
        if: steps.check.outputs.need_sync == 'true' || github.event_name == 'issues' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/inspirations.json
          git diff --staged --quiet || git commit -m "auto: sync inspirations"
          git pull --rebase origin main || true
          git push || echo "Push failed, will retry on next trigger"
