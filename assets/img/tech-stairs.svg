<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200" width="360" height="200" role="img" aria-label="科创成长七阶段阶梯示意：小学、初中、高中、本科、研究生、职业起步、领军期">
  <title>科创成长七阶段</title>
  <rect width="360" height="200" fill="#fbfcfb"/>
  <defs>
    <style>
      .t{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
      .lb{font-size:9.5px;fill:#41544b;text-anchor:middle}
    </style>
  </defs>

  <!-- 基线 -->
  <line x1="6" y1="168" x2="354" y2="168" stroke="#dce5df" stroke-width="1"/>

  <!-- 七级台阶 -->
  <g>
    <rect x="6"   y="146" width="44" height="22"  rx="4" fill="#cfe5dc"/>
    <rect x="56"  y="125" width="44" height="43"  rx="4" fill="#b6d8cb"/>
    <rect x="106" y="104" width="44" height="64"  rx="4" fill="#94c7b6"/>
    <rect x="156" y="83"  width="44" height="85"  rx="4" fill="#6fb3a0"/>
    <rect x="206" y="62"  width="44" height="106" rx="4" fill="#4a9c86"/>
    <rect x="256" y="41"  width="44" height="127" rx="4" fill="#2a8570"/>
    <rect x="306" y="20"  width="44" height="148" rx="4" fill="#0d5c4b"/>
  </g>

  <!-- 阶段名（柱下，统一深色，避免对比度不足） -->
  <g class="t">
    <text class="lb" x="28"  y="184">小学</text>
    <text class="lb" x="78"  y="184">初中</text>
    <text class="lb" x="128" y="184">高中</text>
    <text class="lb" x="178" y="184">本科</text>
    <text class="lb" x="228" y="184">研究生</text>
    <text class="lb" x="278" y="184">职业起步</text>
    <text class="lb" x="328" y="184">领军期</text>
  </g>
</svg>
